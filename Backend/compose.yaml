name: leafclutch

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leafclutch
      POSTGRES_PASSWORD: leafclutch
      POSTGRES_DB: leafclutch
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafclutch -d leafclutch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
